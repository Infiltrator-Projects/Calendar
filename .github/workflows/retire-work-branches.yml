name: Archive and retire old work branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-work-branches.yml'
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - name: Archive exact branch tip before removing the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$current" != "$expected" ]; then
              if [ -n "$current" ]; then echo "::error::Branch changed: $branch"; exit 1; fi
              continue
            fi
            tag="archive/branch-retirement-20261111/${branch//\//-}-${expected:0:12}"
            archived="$(gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$expected" --jq '.object.sha')"
            if [ "$archived" != "$expected" ]; then
              echo "::error::Cannot verify archive for $branch"; exit 1
            fi
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$current" != "$expected" ]; then
              echo "::error::Branch moved during archive: $branch"; exit 1
            fi
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            printf 'Archived and retired %s at %s\n' "$branch" "$expected"
          done <<'RETIRE_BRANCHES'
          hal/ci-package-install-compiler-20261110|78995d04ae55731005eebf9fff5ab3a22f805b2c
          hal/ci-package-install-pinned-common-20261110|981a472276990f91ba2f38580bd8b867b524dd84
          hal/code-hardening-20261110|e6baaf51ce0c089d06dc37a85734e839f43fb69f
          hal/native-abi-validation-20261110|645ae22604c571cc6bfd6c231f75311df14e688e
          hal/native-cinnamon-drift-20261110|c7f3710aa849e6f7ae74ee89ab082626e53c598d
          hal/native-temporal-snapshot-20261110|5b6fab7e92de54e25de27d3d3646eea252e968bd
          hal/review-hardening-2026-11-10|c03314da05eee18e9ec3131a0d8cf769d7d73573
          RETIRE_BRANCHES
