# SPDX-License-Identifier: GPL-3.0-or-later
name: one-shot-calendar-release-readme-1.0.83

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-release-readme-1.0.83.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Synchronize stable release label
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^\*\*Stable release:\*\* 1\.0\.82  $' README.md)" -eq 1
          sed -i 's/^\*\*Stable release:\*\* 1\.0\.82  $/**Stable release:** 1.0.83  /' README.md
          rm -f .github/workflows/one-shot-release-readme-1.0.83.yml
          git config user.name "Calendar maintenance"
          git config user.email "noreply@the-infiltratr.com"
          git add -A
          git diff --cached --check
          git commit -m "Synchronize Calendar 1.0.83 release documentation"
          git push origin HEAD:main
