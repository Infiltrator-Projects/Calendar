name: one-shot-calendar-top-three-hardening

on:
  push:
    branches:
      - hal/calendar-1.0.88-harden-top-three
    paths:
      - .github/workflows/one-shot-harden-top-three.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential desktop-file-utils gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xdotool xvfb xz-utils

      - name: Apply focused hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/harden-top-three.py")
          source = path.read_text(encoding="utf-8")

          guard_needle = '''    forbidden = (
                  "CalendarServerProxy", "bus_watch_name", "_calendar_server",
          '''
          guard_insertion = '''    text = replace_once(
                  text,
                  "        if (this._destroyed || this._calendar_server === null ||\\n            this.event_store === null) {\\n",
                  "        if (this._destroyed || this._transport === null ||\\n            !this._transport.is_ready() || this.event_store === null) {\\n",
                  "visible range through transport readiness",
              )
          '''
          if source.count(guard_needle) != 1:
              raise SystemExit("could not locate eventManager transport guard insertion point")
          source = source.replace(guard_needle, guard_insertion + guard_needle, 1)

          cache_old = '''    text = replace_once(text, "        this._temporalPolicyCache = null;\\n", "        this._temporalPolicy = null;\\n", "policy resolver state")
          '''
          cache_new = '''    if text.count("        this._temporalPolicyCache = null;\\n") != 3:
                  raise RuntimeError("unexpected temporal policy cache lifecycle count")
              text = text.replace(
                  "        this._temporalPolicyCache = null;\\n",
                  "        this._temporalPolicy = null;\\n",
                  1,
              )
          '''
          if source.count(cache_old) != 1:
              raise SystemExit("could not locate temporal policy state migration")
          source = source.replace(cache_old, cache_new, 1)
          path.write_text(source, encoding="utf-8")
          PY
          python3 tools/harden-top-three.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/test-settings.py")
          source = path.read_text(encoding="utf-8")
          old = '    assert re.search(r"class EventsManager\\s*\\{\\s*constructor\\s*\\(\\s*\\)", event_manager)\n'
          new = (
              '    assert re.search(\n'
              '        r"class EventsManager\\s*\\{\\s*constructor\\s*\\(\\s*transport\\s*=\\s*null\\s*\\)",\n'
              '        event_manager,\n'
              '    )\n'
              '    require_tokens(\n'
              '        event_manager,\n'
              '        "this._transport = transport || new CalendarServerTransport()",\n'
              '    )\n'
          )
          if source.count(old) != 1:
              raise SystemExit("could not locate obsolete EventsManager constructor assertion")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python3 tools/update-translations.py
          python3 tools/update-runtime-hashes.py
          git diff --check

      - name: Run complete Calendar gate
        run: |
          set -euo pipefail
          make clean check

      - name: Commit validated release candidate and remove one-shot machinery
        run: |
          set -euo pipefail
          rm -f tools/harden-top-three.py
          rm -f .github/workflows/one-shot-harden-top-three.yml
          git add -A
          git diff --cached --check
          git config user.name "Calendar maintenance"
          git config user.email "noreply@the-infiltratr.com"
          git commit -m "Release 1.0.88: harden orchestration boundaries"
          git push origin HEAD:hal/calendar-1.0.88-harden-top-three
