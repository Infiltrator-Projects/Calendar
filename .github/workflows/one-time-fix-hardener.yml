name: one-time-fix-hardener

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repair exact README guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/one-time-hardening.yml')
          text = path.read_text(encoding='utf-8')
          text, old_count = re.subn(
              r'^(\s+)"\*\*Stable release:\*\* 1\.0\.92.*$',
              r'\1"**Stable release:** 1.0.92",',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text, new_count = re.subn(
              r'^(\s+)"\*\*Stable release:\*\* 1\.0\.93.*$',
              r'\1"**Stable release:** 1.0.93",',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if old_count != 1 or new_count != 1:
              raise SystemExit(f'unexpected README guard counts: {old_count}, {new_count}')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add .github/workflows/one-time-hardening.yml
          git commit -m "Repair Calendar hardening guard"
          git push origin HEAD:main
