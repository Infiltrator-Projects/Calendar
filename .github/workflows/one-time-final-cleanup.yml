name: one-time-final-cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete every non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads" \
            --jq '.[].ref' | while IFS= read -r ref; do
              branch=${ref#refs/heads/}
              if [[ "$branch" != "main" ]]; then
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              fi
            done
