# SPDX-License-Identifier: GPL-3.0-or-later
name: temporary-version-sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Synchronize Makefile version
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'VERSION := 1.0.99' Makefile
          sed -i 's/^VERSION := 1\.0\.99$/VERSION := 1.0.100/' Makefile
          git config user.name 'Calendar release automation'
          git config user.email 'noreply@the-infiltratr.com'
          git add Makefile
          git commit -m 'Synchronize Calendar version 1.0.100'
          git push origin HEAD:main
