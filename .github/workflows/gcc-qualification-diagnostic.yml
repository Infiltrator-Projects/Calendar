name: gcc-qualification-diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang desktop-file-utils gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xdotool xvfb xz-utils
      - name: Compile and run production tests
        run: make clean test
      - name: Validate JavaScript and generated settings
        run: make validate-js
      - name: Validate translations
        run: make validate-translations
      - name: Validate runtime source hashes
        run: make validate-sources
      - name: Validate package inputs
        run: make validate-package-inputs
      - name: Validate About desktop entry
        run: make validate-about-desktop
      - name: Validate release model
        run: make validate-release-model
      - name: Validate architecture
        run: make validate-architecture
      - name: Validate upstream drift
        run: make validate-upstream-drift
      - name: Validate exported symbols
        run: make validate-exports
      - name: Validate ABI
        run: make validate-abi
      - name: Validate runtime dependencies
        run: make validate-runtime-deps
      - name: Smoke GObject introspection runtime
        run: make smoke-gjs
      - name: Build from a path containing spaces
        run: make path-space-smoke
