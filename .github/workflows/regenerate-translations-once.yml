# SPDX-License-Identifier: GPL-3.0-or-later
name: regenerate-translations-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regenerate-translations-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: Regenerate catalogues
        run: python3 tools/update-translations.py
      - name: Commit generated catalogues
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/i18n; then
            echo "Translation catalogues were already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n
          git commit -m "i18n: regenerate Calendar 1.0.37 catalogues"
          git push origin HEAD:main
