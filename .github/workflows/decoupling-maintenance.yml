name: decoupling-maintenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/decoupling-maintenance.yml

permissions:
  contents: write

jobs:
  finish-decoupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update runtime harness for decoupled agenda state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/test-js-runtime.js")
          text = path.read_text(encoding="utf-8")

          snapshot_needle = "                                get_color_range(first, count, now, maximum) {"
          snapshot_insertion = (
              "                                get_snapshot() {\n"
              "                                    return {\n"
              "                                        deep_unpack() {\n"
              "                                            return [123456, []];\n"
              "                                        },\n"
              "                                    };\n"
              "                                },\n"
          )
          if "                                get_snapshot() {" not in text:
              if text.count(snapshot_needle) != 1:
                  raise SystemExit("EventStore mock insertion point changed")
              text = text.replace(
                  snapshot_needle,
                  snapshot_insertion + snapshot_needle,
              )

          first_pattern = re.compile(
              r"    const eventList = \{\n"
              r"        set_events\(snapshot, delayed, unavailable\) \{\n"
              r"            presented\.push\(\[snapshot, delayed, unavailable\]\);\n"
              r"        \},\n"
              r"    \};\n"
              r"    const manager = new EventsManager\(\n"
              r"        \{ getValue\(\) \{ return true; \} \},\n"
              r"        \{\},\n"
              r"        eventList\n"
              r"    \);\n"
          )
          first_replacement = (
              "    const manager = new EventsManager(\n"
              "        { getValue() { return true; } },\n"
              "        {}\n"
              "    );\n"
              "    manager.emit = (signal, ...args) => {\n"
              "        if (signal === \"agenda-events-changed\") {\n"
              "            presented.push(args);\n"
              "        }\n"
              "    };\n"
          )
          text, first_count = first_pattern.subn(first_replacement, text, count=1)
          if first_count != 1:
              raise SystemExit("server-loss presentation test shape changed")

          second_pattern = re.compile(
              r"    const manager = new EventsManager\(\n"
              r"        \{ getValue\(\) \{ return true; \} \},\n"
              r"        \{\},\n"
              r"        \{\n"
              r"            set_events\(snapshot, delayed, unavailable\) \{\n"
              r"                presented\.push\(\[snapshot, delayed, unavailable\]\);\n"
              r"            \},\n"
              r"        \}\n"
              r"    \);\n"
          )
          second_replacement = (
              "    const manager = new EventsManager(\n"
              "        { getValue() { return true; } },\n"
              "        {}\n"
              "    );\n"
              "    manager.emit = (signal, ...args) => {\n"
              "        if (signal === \"agenda-events-changed\") {\n"
              "            presented.push(args);\n"
              "        }\n"
              "    };\n"
          )
          text, second_count = second_pattern.subn(second_replacement, text, count=1)
          if second_count != 1:
              raise SystemExit("no-calendar presentation test shape changed")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Refresh runtime integrity manifest
        run: python3 tools/update-runtime-hashes.py

      - name: Validate JavaScript and architecture contracts
        run: |
          node tests/test-js-runtime.js
          python3 tests/test-settings.py
          python3 tests/test-popup-lifecycle.py
          python3 tools/update-runtime-hashes.py --check

      - name: Commit validated maintenance result and remove one-shot workflow
        run: |
          rm .github/workflows/decoupling-maintenance.yml
          git config user.name "The-First-Infiltrator"
          git config user.email "infiltratr@yandex.com"
          git add tests/test-js-runtime.js src/cinnamon/runtime-sources.sha256 .github/workflows/decoupling-maintenance.yml
          git commit -m "Complete Calendar decoupling validation"
          git push origin HEAD:main
