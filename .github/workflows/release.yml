name: publish-qualified-release

# This is a reusable final stage of build-and-test. It publishes the exact
# bytes qualified by the caller and never rebuilds them.
on:
  workflow_call:
    inputs:
      artifact_name:
        description: Exact Actions artifact containing the qualified release handoff
        required: true
        type: string
      release_sha:
        description: Exact source revision qualified by the caller
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download exact qualified release handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: qualified-release

      - name: Verify qualified release handoff
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: >-
          python3 qualified-release/release-handoff.py verify
          --dist qualified-release
          --expected-sha "$EXPECTED_SHA"
          --github-env "$GITHUB_ENV"

      # Tag creation is owned by GitHub release creation. Calendar never creates,
      # rewrites or deletes a tag as a separate recovery step.
      - name: Create or inspect draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_was_published=false
          if release_json=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null); then
            release_is_draft=$(jq -r '.draft' <<<"$release_json")
            if [[ "$release_is_draft" == "false" ]]; then
              release_was_published=true
              printf 'Release %s is already published; verifying immutable assets.\n' \
                "$RELEASE_TAG"
            else
              printf 'Release %s already exists as a draft; resuming publication.\n' \
                "$RELEASE_TAG"
            fi
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              >/dev/null 2>&1; then
              printf 'Release tag %s exists without a GitHub release.\n' \
                "$RELEASE_TAG" >&2
              printf 'Release identities are immutable; bump VERSION instead of recovering the tag.\n' \
                >&2
              exit 1
            fi

            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$RELEASE_HEAD" \
              --title "Calendar $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES"
          fi

          tag_commit=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha')
          if [[ "$tag_commit" != "$RELEASE_HEAD" ]]; then
            printf 'Release tag %s points to %s; expected qualified revision %s.\n' \
              "$RELEASE_TAG" "$tag_commit" "$RELEASE_HEAD" >&2
            exit 1
          fi

          printf 'RELEASE_WAS_PUBLISHED=%s\n' "$release_was_published" >> "$GITHUB_ENV"

      - name: Upload qualified assets to draft
        if: env.RELEASE_WAS_PUBLISHED == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "$RELEASE_DEB" "$RELEASE_INSTALLER"
          --clobber

      - name: Verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=$(printf '%s\n%s\n' \
            "$RELEASE_DEB_NAME" "$RELEASE_INSTALLER_NAME" | sort)
          published_assets=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$RELEASE_TAG" >&2
            printf 'Expected:\n%s\nPublished:\n%s\n' \
              "$expected_assets" "$published_assets" >&2
            exit 1
          fi

          verify_asset() {
            local name=$1
            local size=$2
            local digest=$3
            local remote_size remote_digest

            remote_size=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq ".assets[] | select(.name == \"${name}\") | .size")
            [[ "$remote_size" == "$size" ]] || {
              printf 'Release asset %s has size %s; expected %s.\n' \
                "$name" "$remote_size" "$size" >&2
              exit 1
            }

            remote_digest=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq ".assets[] | select(.name == \"${name}\") | .digest // \"\"")
            if [[ -n "$remote_digest" && "$remote_digest" != "sha256:${digest}" ]]; then
              printf 'Release asset %s digest mismatch.\n' "$name" >&2
              exit 1
            fi
          }

          verify_asset \
            "$RELEASE_DEB_NAME" "$RELEASE_DEB_SIZE" "$RELEASE_DEB_SHA256"
          verify_asset \
            "$RELEASE_INSTALLER_NAME" "$RELEASE_INSTALLER_SIZE" \
            "$RELEASE_INSTALLER_SHA256"

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_WAS_PUBLISHED" == "false" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

          release_json=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          [[ "$(jq -r '.tag_name' <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.draft' <<<"$release_json")" == "false" ]]

      # Central APT publication remains asynchronous. Infiltrator-Repository
      # discovers verified GitHub releases independently; Calendar does not wait
      # on or fail because of that external publication schedule.
