name: publish-qualified-release

# This is a reusable final stage of build-and-test. It publishes the exact
# bytes qualified by the caller and never rebuilds them.
on:
  workflow_call:
    inputs:
      artifact_name:
        description: Exact Actions artifact containing the qualified release handoff
        required: true
        type: string
      release_sha:
        description: Exact source revision qualified by the caller
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download exact qualified release handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: qualified-release

      - name: Verify qualified release handoff
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: >-
          python3 qualified-release/release-handoff.py verify
          --dist qualified-release
          --expected-sha "$EXPECTED_SHA"
          --github-env "$GITHUB_ENV"

      # Draft releases deliberately do not create their Git tag yet. Track the
      # draft by release ID, verify its exact target, stage the qualified assets,
      # then verify the tag only after publication creates it.
      - name: Create or inspect draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t release_ids < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id"
          )
          if (( ${#release_ids[@]} > 1 )); then
            printf 'More than one GitHub release uses tag identity %s.\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi

          release_was_published=false
          if (( ${#release_ids[@]} == 1 )); then
            release_id=${release_ids[0]}
            release_json=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}")
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              >/dev/null 2>&1; then
              printf 'Release tag %s exists without a GitHub release.\n' \
                "$RELEASE_TAG" >&2
              printf 'Release identities are immutable; bump VERSION instead of recovering the tag.\n' \
                >&2
              exit 1
            fi

            notes=$(cat "$RELEASE_NOTES")
            release_json=$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_HEAD" \
              -f name="Calendar $RELEASE_VERSION" \
              -f body="$notes" \
              -F draft=true \
              -F prerelease=false)
            release_id=$(jq -r '.id' <<<"$release_json")
          fi

          release_tag=$(jq -r '.tag_name' <<<"$release_json")
          release_target=$(jq -r '.target_commitish' <<<"$release_json")
          release_is_draft=$(jq -r '.draft' <<<"$release_json")
          if [[ "$release_tag" != "$RELEASE_TAG" ]]; then
            printf 'Release %s reports unexpected tag %s.\n' \
              "$release_id" "$release_tag" >&2
            exit 1
          fi
          if [[ "$release_target" != "$RELEASE_HEAD" ]]; then
            printf 'Release %s targets %s; expected qualified revision %s.\n' \
              "$release_id" "$release_target" "$RELEASE_HEAD" >&2
            exit 1
          fi

          case "$release_is_draft" in
            true)
              printf 'Release %s exists as draft %s; staging exact assets.\n' \
                "$RELEASE_TAG" "$release_id"
              ;;
            false)
              release_was_published=true
              printf 'Release %s is already published; verifying immutable assets.\n' \
                "$RELEASE_TAG"
              ;;
            *)
              printf 'Release %s has invalid draft state %s.\n' \
                "$release_id" "$release_is_draft" >&2
              exit 1
              ;;
          esac

          printf 'RELEASE_ID=%s\n' "$release_id" >> "$GITHUB_ENV"
          printf 'RELEASE_WAS_PUBLISHED=%s\n' "$release_was_published" >> "$GITHUB_ENV"

      - name: Upload qualified assets to draft
        if: env.RELEASE_WAS_PUBLISHED == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # A retry may encounter a partially populated draft. Draft contents are
          # not public identity, so reset them and upload only the qualified bytes.
          mapfile -t asset_ids < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq '.[].id'
          )
          for asset_id in "${asset_ids[@]}"; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

          upload_asset() {
            local path=$1
            local name=$2
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${path}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              >/dev/null
          }

          upload_asset "$RELEASE_DEB" "$RELEASE_DEB_NAME"
          upload_asset "$RELEASE_INSTALLER" "$RELEASE_INSTALLER_NAME"

      - name: Verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=$(printf '%s\n%s\n' \
            "$RELEASE_DEB_NAME" \
            "$RELEASE_INSTALLER_NAME" | sort)
          published_assets=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$RELEASE_TAG" >&2
            printf 'Expected:\n%s\nPublished:\n%s\n' \
              "$expected_assets" "$published_assets" >&2
            exit 1
          fi

          verify_asset() {
            local name=$1
            local size=$2
            local digest=$3
            local remote_size remote_digest

            remote_size=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${name}\") | .size")
            [[ "$remote_size" == "$size" ]] || {
              printf 'Release asset %s has size %s; expected %s.\n' \
                "$name" "$remote_size" "$size" >&2
              exit 1
            }

            remote_digest=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${name}\") | .digest // \"\"")
            if [[ "$remote_digest" != "sha256:${digest}" ]]; then
              printf 'Release asset %s digest is %s; expected sha256:%s.\n' \
                "$name" "${remote_digest:-<missing>}" "$digest" >&2
              exit 1
            fi
          }

          verify_asset \
            "$RELEASE_DEB_NAME" "$RELEASE_DEB_SIZE" "$RELEASE_DEB_SHA256"
          verify_asset \
            "$RELEASE_INSTALLER_NAME" "$RELEASE_INSTALLER_SIZE" \
            "$RELEASE_INSTALLER_SHA256"

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_WAS_PUBLISHED" == "false" ]]; then
            release_json=$(gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -f make_latest=true)
          else
            release_json=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          fi

          [[ "$(jq -r '.tag_name' <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.draft' <<<"$release_json")" == "false" ]]
          [[ "$(jq -r '.target_commitish' <<<"$release_json")" == "$RELEASE_HEAD" ]]

          tag_commit=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha')
          if [[ "$tag_commit" != "$RELEASE_HEAD" ]]; then
            printf 'Published tag %s points to %s; expected qualified revision %s.\n' \
              "$RELEASE_TAG" "$tag_commit" "$RELEASE_HEAD" >&2
            exit 1
          fi

      # Central APT publication remains asynchronous. Infiltrator-Repository
      # discovers verified GitHub releases independently; Calendar does not wait
      # on or fail because of that external publication schedule.
