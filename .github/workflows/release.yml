name: publish-release

# Publication is gated by the successful main-branch CI run for an explicit
# Release commit, so no untested tree can become a GitHub release. Generated
# translation and runtime-integrity metadata are validated by that CI gate.
on:
  workflow_run:
    workflows: ["build-and-test"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download exact CI-qualified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calendar-release-${{ github.event.workflow_run.head_sha }}
          path: approved-assets
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install release dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper desktop-file-utils devscripts gettext gh gobject-introspection gjs jq \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xz-utils lintian shellcheck

      - name: Validate approved source identity
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          if [[ "$head_commit" != "$EXPECTED_SHA" || "$main_commit" != "$EXPECTED_SHA" ]]; then
            printf 'Release source %s is not exact current main %s.\n' \
              "$head_commit" "$main_commit" >&2
            exit 1
          fi

          release_subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$release_subject" != Release\ * ]]; then
            printf 'Current main is not an explicit Release commit.\n' >&2
            exit 1
          fi

          version=$(sed -n 's/^VERSION := //p' Makefile)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            printf 'Invalid source version: %s\n' "$version" >&2
            exit 1
          fi
          if [[ "$release_subject" != "Release ${version}" && "$release_subject" != "Release ${version}:"* ]]; then
            printf 'Release commit subject must begin with Release %s.\n' "$version" >&2
            exit 1
          fi

          {
            printf 'RELEASE_VERSION=%s\n' "$version"
            printf 'RELEASE_TAG=v%s\n' "$version"
            printf 'RELEASE_HEAD=%s\n' "$head_commit"
          } >> "$GITHUB_ENV"

      - name: Run release qualification gates
        shell: bash
        run: |
          set -euo pipefail
          CALENDAR_RELEASE_SOURCE_ALREADY_QUALIFIED=1 make release-check

      - name: Verify exact CI-qualified artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"
          deb="dist/calendar_${version}_amd64.deb"
          installer="dist/calendar-${version}-local-folder.run"
          approved_deb="approved-assets/calendar_${version}_amd64.deb"
          approved_installer="approved-assets/calendar-${version}-local-folder.run"

          require_file() {
            local path=$1
            local description=$2
            if [[ ! -f "$path" ]]; then
              printf 'Missing %s: %s\n' "$description" "$path" >&2
              exit 1
            fi
          }

          require_executable() {
            local path=$1
            local description=$2
            require_file "$path" "$description"
            if [[ ! -x "$path" ]]; then
              printf '%s is not executable: %s\n' "$description" "$path" >&2
              exit 1
            fi
          }

          require_file "$deb" 'rebuilt Debian package'
          require_executable "$installer" 'rebuilt local installer'
          require_file "$approved_deb" 'CI-qualified Debian package'
          # GitHub Actions artifact transport does not preserve executable mode bits.
          # Content identity is enforced below against the freshly built executable.
          require_file "$approved_installer" 'CI-qualified local installer'

          cmp --silent "$deb" "$approved_deb" || {
            echo 'Rebuilt Debian package differs from the exact CI-qualified artifact.' >&2
            exit 1
          }
          cmp --silent "$installer" "$approved_installer" || {
            echo 'Rebuilt local installer differs from the exact CI-qualified artifact.' >&2
            exit 1
          }

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          notes="${RUNNER_TEMP}/release-notes.md"
          awk '
            NR == 1 { next }
            /^ -- / { exit }
            {
              sub(/^  \* /, "- ")
              print
            }
          ' debian/changelog | sed '/^[[:space:]]*$/d' > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo 'Release notes extracted from debian/changelog are empty.' >&2
            exit 1
          fi

      - name: Verify or create release tag
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          head_commit="$RELEASE_HEAD"
          remote_tag_commit=$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1}')
          if [[ -n "$remote_tag_commit" && "$remote_tag_commit" != "$head_commit" ]]; then
            printf 'Release tag %s points to %s, not approved commit %s.\n' \
              "$tag" "$remote_tag_commit" "$head_commit" >&2
            exit 1
          fi
          if [[ -z "$remote_tag_commit" ]]; then
            git tag "$tag" "$head_commit"
            git push origin "$tag"
          fi

      - name: Create or inspect GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          version="$RELEASE_VERSION"
          head_commit="$RELEASE_HEAD"
          notes="${RUNNER_TEMP}/release-notes.md"
          release_was_published=false

          if release_state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$release_state" != true ]]; then
              release_was_published=true
              printf 'Release %s is already published; verifying immutable assets.\n' "$tag"
            else
              printf 'Release %s already exists as a draft; resuming publication.\n' "$tag"
            fi
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --target "$head_commit" \
              --title "Calendar $version" \
              --notes-file "$notes"
          fi

          printf 'RELEASE_WAS_PUBLISHED=%s\n' "$release_was_published" >> "$GITHUB_ENV"

      - name: Upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"
          tag="$RELEASE_TAG"
          deb="approved-assets/calendar_${version}_amd64.deb"
          installer="approved-assets/calendar-${version}-local-folder.run"
          release_was_published="$RELEASE_WAS_PUBLISHED"

          if [[ "$release_was_published" == false ]]; then
            gh release upload "$tag" "$deb" "$installer" --clobber
          fi

      - name: Verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"
          tag="$RELEASE_TAG"
          deb="approved-assets/calendar_${version}_amd64.deb"
          installer="approved-assets/calendar-${version}-local-folder.run"

          expected_assets=$(printf '%s\n%s\n' \
            "${deb##*/}" "${installer##*/}" | sort)
          published_assets=$(gh release view "$tag" --json assets \
            --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
            printf 'Expected:\n%s\nPublished:\n%s\n' \
              "$expected_assets" "$published_assets" >&2
            exit 1
          fi

          release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")
          for asset in "$deb" "$installer"; do
            name="${asset##*/}"
            local_size=$(stat -c '%s' "$asset")
            remote_size=$(jq -r --arg name "$name" \
              '[.assets[] | select(.name == $name) | .size][0] // 0' \
              <<<"$release_json")
            if [[ "$remote_size" != "$local_size" ]]; then
              printf 'Release asset %s has size %s; expected %s.\n' \
                "$name" "$remote_size" "$local_size" >&2
              exit 1
            fi

            local_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            remote_digest=$(jq -r --arg name "$name" \
              '[.assets[] | select(.name == $name) | .digest][0] // ""' \
              <<<"$release_json")
            if [[ -n "$remote_digest" && "$remote_digest" != "$local_digest" ]]; then
              printf 'Release asset %s digest mismatch.\n' "$name" >&2
              exit 1
            fi
          done

      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          release_was_published="$RELEASE_WAS_PUBLISHED"
          if [[ "$release_was_published" == false ]]; then
            gh release edit "$tag" --draft=false --latest
          fi

          published_tag=$(gh release view "$tag" --json tagName --jq .tagName)
          if [[ "$published_tag" != "$tag" ]]; then
            printf 'Published release tag %s does not match expected tag %s.\n' \
              "$published_tag" "$tag" >&2
            exit 1
          fi

      # Central APT publication is intentionally asynchronous. The tokenless
      # Infiltrator-Repository publisher discovers verified GitHub releases on
      # its own schedule; Calendar must not wait on or fail because of that
      # external best-effort schedule.
