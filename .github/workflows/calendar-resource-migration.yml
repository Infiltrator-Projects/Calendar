# SPDX-License-Identifier: GPL-3.0-or-later
name: one-shot-calendar-resource-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/calendar-resource-migration.yml
      - tools/migrate-calendar-resources.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: true
      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          COMMON_SHA=3b86318e5c2277db4f2e5b3c1c5b35cd3bfe3b09
          git -C src/vendor/infiltratr-common fetch --depth=1 origin "$COMMON_SHA"
          git -C src/vendor/infiltratr-common checkout --detach "$COMMON_SHA"
          python3 tools/migrate-calendar-resources.py
          git checkout HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/calendar-resource-migration.yml \
            tools/migrate-calendar-resources.py
          git diff --check
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Move Gregorian Persian and Coptic to calendar resources'
          git push origin HEAD:main
