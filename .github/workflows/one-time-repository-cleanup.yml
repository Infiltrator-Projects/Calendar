name: one-time-repository-cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove stale branches and unpublished orphan tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads" \
            --jq '.[].ref' | while IFS= read -r ref; do
              branch=${ref#refs/heads/}
              if [[ "$branch" != "main" ]]; then
                printf 'Deleting stale branch %s\n' "$branch"
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              fi
            done

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.92" \
            >/dev/null 2>&1; then
            echo 'v1.0.92 is already a GitHub release; refusing to delete its tag.' >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.92" \
            >/dev/null 2>&1; then
            printf 'Deleting unpublished orphan tag v1.0.92\n'
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1.0.92"
          fi
