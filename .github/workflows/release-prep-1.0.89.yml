name: prepare-1.0.89

on:
  push:
    branches: [release/calendar-1.0.89-quality-hardening]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/calendar-1.0.89-quality-hardening
          fetch-depth: 0
      - name: Install metadata tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          version = "1.0.89"

          makefile = Path("Makefile")
          text = makefile.read_text(encoding="utf-8")
          text = re.sub(r"^VERSION := .*?$", f"VERSION := {version}", text, count=1, flags=re.M)
          text = re.sub(r"^SOURCE_DATE_EPOCH \?= .*?$", "SOURCE_DATE_EPOCH ?= 1791763200", text, count=1, flags=re.M)
          makefile.write_text(text, encoding="utf-8")

          metadata_path = Path("src/cinnamon/metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          metadata["version"] = version
          metadata_path.write_text(json.dumps(metadata, indent=4, ensure_ascii=False) + "\n", encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text, count = re.subn(r"\*\*Stable release:\*\* 1\.0\.88", "**Stable release:** 1.0.89", text, count=1)
          if count != 1:
              raise SystemExit("README stable release marker not found")
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          old = "## Unreleased\n\nNo unreleased changes.\n\n## 1.0.88 - 2026-10-11"
          new = """## Unreleased

No unreleased changes.

## 1.0.89 - 2026-10-12

- Split temporal-policy discovery and monitoring from the SystemClock facade while preserving the existing public ABI and coherent policy snapshot.
- Isolate system-timezone observation from EventsManager so event/range orchestration no longer owns filesystem-monitor lifetime; retain transactional snapshot failure handling and explicit state ownership.
- Replace remaining source-spelling architecture assertions with ownership/dependency contracts and add a pull-request validation gate before changes reach main.
- Carry forward the post-1.0.88 ownership, failure-observability, runtime-manifest and App-Install release-assertion hardening already validated on main.

## 1.0.88 - 2026-10-11"""
          if old not in text:
              raise SystemExit("CHANGELOG release insertion marker not found")
          changelog.write_text(text.replace(old, new, 1), encoding="utf-8")

          debian = Path("debian/changelog")
          text = debian.read_text(encoding="utf-8")
          entry = """infiltrator-calendar (1.0.89) unstable; urgency=medium

  * Split temporal-policy monitoring from the SystemClock facade.
  * Isolate timezone observation from EventsManager event/range orchestration.
  * Replace brittle architecture spelling checks with ownership contracts.
  * Add pull-request validation before main-line release qualification.

 -- Shannon Smith <infiltratr@yandex.com>  Sun, 11 Oct 2026 23:10:00 +0000

"""
          debian.write_text(entry + text, encoding="utf-8")
          PY

          python3 tools/update-translations.py
          python3 tools/update-runtime-hashes.py

          rm -f .github/workflows/release-prep-1.0.89.yml

          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git commit -m "Release 1.0.89: harden remaining orchestration boundaries"
          git push origin HEAD:release/calendar-1.0.89-quality-hardening
