# SPDX-License-Identifier: GPL-3.0-or-later
name: one-time Calendar exact release path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-calendar-release-path.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install exact-artifact qualification path
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/one-time-calendar-release-path.py
          git rm .github/workflows/one-time-calendar-release-path.yml tools/one-time-calendar-release-path.py
          git diff --check
          git diff --exit-code --quiet && {
            echo 'No migration changes were produced.' >&2
            exit 1
          }
          git config user.name 'Calendar Release Path'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/release.yml tools/cinnamon-smoke.sh tools/live-cinnamon-ci-smoke.sh
          git commit -m 'Qualify and publish the exact Calendar release artifact'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo 'main moved during exact-artifact migration; refusing stale push.' >&2
            exit 1
          }
          git push origin HEAD:main
