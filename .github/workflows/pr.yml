name: pull-request-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang desktop-file-utils gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 shellcheck xz-utils
      - name: Validate candidate
        run: make clean check
      - name: Sanitizer regression gate
        run: make sanitize
