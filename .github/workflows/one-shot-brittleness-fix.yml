# SPDX-License-Identifier: GPL-3.0-or-later
name: one-shot-calendar-brittleness-fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-brittleness-fix.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Apply guarded coupling fixes
        run: python3 tools/one-shot-brittleness-fix.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential desktop-file-utils gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xdotool xvfb xz-utils

      - name: Run complete Calendar gate
        run: make clean check

      - name: Commit refactor and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-brittleness-fix.yml
          rm -f tools/one-shot-brittleness-fix.py
          git config user.name "Calendar maintenance"
          git config user.email "noreply@the-infiltratr.com"
          git add -A
          git diff --cached --check
          git commit -m "Refactor Calendar brittle boundaries"
          git push origin HEAD:main
