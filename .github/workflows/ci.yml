name: build-and-test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    build-and-test-v5-${{
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
      && github.sha || github.ref
    }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')) }}

jobs:
  native:
    name: Native / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang desktop-file-utils gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xdotool xvfb xz-utils
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CC" == "gcc" ]]; then
            make clean check
          else
            # GCC owns the complete policy/release validation. Clang's distinct
            # purpose is compiling and executing the production C/test surface.
            make clean test
          fi
      - name: Reopen native About dialog twice under Xvfb
        if: matrix.compiler == 'gcc'
        run: xvfb-run -a tools/about-dialog-smoke.sh ./build/calendar-plus-about
      - name: Probe exact-version live Cinnamon qualification
        if: matrix.compiler == 'gcc'
        id: live-cinnamon
        run: tools/live-cinnamon-ci-smoke.sh --probe
      - name: Live Cinnamon smoke of exact source revision
        if: >-
          matrix.compiler == 'gcc' &&
          steps.live-cinnamon.outputs.ready == 'true'
        env:
          CALENDAR_PLUS_LIVE_MODE: ${{ steps.live-cinnamon.outputs.mode }}
          DEB_BUILD_OPTIONS: nocheck
        run: tools/live-cinnamon-ci-smoke.sh

  icu-compat:
    name: ICU ${{ matrix.icu_major }} runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            icu_major: 72
          - image: debian:13
            icu_major: 76
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare checkout runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gettext gobject-introspection gjs \
            libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3
      - name: Verify ICU major and execute Calendar tests
        shell: bash
        run: |
          set -euo pipefail
          ldconfig -p | grep -Eq "libicuuc\\.so\\.${{ matrix.icu_major }}([[:space:]]|$)"
          make clean test

  sanitizer:
    name: ASan / UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gobject-introspection \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev pkg-config
      - name: ASan and UBSan
        run: make sanitize

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install coverage dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcovr libglib2.0-dev libgtk-3-dev libicu-dev pkg-config
      - name: Coverage gate
        run: make coverage

  static-analysis:
    name: Clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install analysis dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy libglib2.0-dev libgtk-3-dev libicu-dev pkg-config
      - name: Clang-Tidy
        run: make static-analysis

  debian-package:
    needs: [native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper desktop-file-utils devscripts gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xz-utils \
            lintian shellcheck
      - name: Run packaging and release gates
        env:
          CALENDAR_RELEASE_SOURCE_ALREADY_QUALIFIED: "1"
        run: make release-check
      - name: Create immutable release handoff
        shell: bash
        run: |
          set -euo pipefail

          version=$(sed -n 's/^VERSION := //p' Makefile)
          deb="dist/calendar_${version}_amd64.deb"
          installer="dist/calendar-${version}-local-folder.run"
          notes="dist/release-notes.md"
          manifest="dist/release-manifest.txt"

          test -s "$deb"
          test -s "$installer"
          awk '
            NR == 1 { next }
            /^ -- / { exit }
            {
              sub(/^  \* /, "- ")
              print
            }
          ' debian/changelog | sed '/^[[:space:]]*$/d' > "$notes"
          test -s "$notes"

          {
            printf 'version=%s\n' "$version"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'deb=%s\n' "${deb##*/}"
            printf 'deb_sha256=%s\n' "$(sha256sum "$deb" | awk '{print $1}')"
            printf 'installer=%s\n' "${installer##*/}"
            printf 'installer_sha256=%s\n' "$(sha256sum "$installer" | awk '{print $1}')"
          } > "$manifest"
      - name: Retain exact qualified release handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calendar-release-${{ github.sha }}
          path: |
            dist/calendar_*_amd64.deb
            dist/calendar-*-local-folder.run
            dist/release-manifest.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 3

  bigbedroom-live-probe:
    name: BigBedroom / live Cinnamon qualification
    needs: [debian-package]
    runs-on: bigbedroom
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Download exact qualified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calendar-release-${{ github.sha }}
          path: qualified-release
      - name: Locate exact qualified package
        id: qualified-package
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find qualified-release -maxdepth 1 -type f -name 'calendar_*_amd64.deb' -print -quit)
          test -n "$deb" && test -s "$deb"
          printf 'deb=%s/%s\n' "$GITHUB_WORKSPACE" "$deb" >> "$GITHUB_OUTPUT"
      - name: Probe exact-source Cinnamon qualification
        id: live-cinnamon
        env:
          CALENDAR_PLUS_EXACT_DEB: ${{ steps.qualified-package.outputs.deb }}
        shell: bash
        run: tools/live-cinnamon-ci-smoke.sh --probe
      - name: Require live Cinnamon for release commits
        if: >-
          startsWith(github.event.head_commit.message, 'Release ') &&
          steps.live-cinnamon.outputs.ready != 'true'
        shell: bash
        run: |
          echo 'Release commits require an available real Cinnamon session.' >&2
          exit 1
      - name: Live Cinnamon runtime qualification
        if: steps.live-cinnamon.outputs.ready == 'true'
        env:
          CALENDAR_PLUS_LIVE_MODE: ${{ steps.live-cinnamon.outputs.mode }}
          CALENDAR_PLUS_EXACT_DEB: ${{ steps.qualified-package.outputs.deb }}
          DEB_BUILD_OPTIONS: nocheck
        run: tools/live-cinnamon-ci-smoke.sh

  package-install:
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    steps:
      - name: Prepare clean Debian container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install package build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper desktop-file-utils devscripts gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xz-utils
      - name: Build, install, execute and purge generic package
        shell: bash
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION := //p' Makefile)"
          dpkg-buildpackage -us -uc -b
          deb="../infiltrator-calendar_${version}_amd64.deb"
          test -s "$deb"
          apt-get install -y --no-install-recommends "$deb"
          test "$(dpkg-query -W -f='${Status}' infiltrator-calendar)" = "install ok installed"
          /usr/libexec/calendar-plus-about --print-metadata | grep -qx "version=$version"
          /usr/libexec/calendar-plus-about --print-metadata | grep -qx "build-profile=generic"
          CALENDAR_PLUS_EXPECTED_VERSION="$version" gjs tests/smoke-typelib.js >/dev/null
          apt-get purge -y infiltrator-calendar
          ! dpkg-query -W infiltrator-calendar >/dev/null 2>&1
          apt-get check
      - name: Migrate retired package identities
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION := //p' Makefile)"
          deb="../infiltrator-calendar_${version}_amd64.deb"
          test -s "$deb"

          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT

          build_legacy_package() {
            name="$1"
            legacy_version="$2"
            root="$temp/${name}-root"
            rm -rf "$root"
            mkdir -p "$root/DEBIAN" "$root/usr/lib/x86_64-linux-gnu"
            printf '%s\n' \
              "Package: $name" \
              "Version: $legacy_version" \
              "Architecture: amd64" \
              "Maintainer: Calendar migration test <noreply@the-infiltratr.com>" \
              "Description: synthetic retired Calendar package for upgrade testing" \
              >"$root/DEBIAN/control"
            printf 'legacy-owned-path\n' > \
              "$root/usr/lib/x86_64-linux-gnu/libcalendar-plus.so.0.0.0"
            dpkg-deb --build "$root" "$temp/${name}_${legacy_version}_amd64.deb" \
              >/dev/null
          }

          for legacy in "calendar-plus 3.6.0" "cinnamon-calendar 1.0.16"; do
            set -- $legacy
            name="$1"
            legacy_version="$2"
            build_legacy_package "$name" "$legacy_version"
            legacy_deb="$temp/${name}_${legacy_version}_amd64.deb"

            dpkg -i "$legacy_deb"
            test "$(dpkg-query -W -f='${Status}' "$name")" = "install ok installed"

            apt-get install -y --no-install-recommends "$deb"
            test "$(dpkg-query -W -f='${Status}' infiltrator-calendar)" = \
              "install ok installed"
            ! dpkg-query -W -f='${Status}' "$name" 2>/dev/null | \
              grep -qx "install ok installed"

            apt-get purge -y infiltrator-calendar
            dpkg --purge "$name" >/dev/null 2>&1 || true
          done
          apt-get check

  publish-release:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'Release ')
    needs:
      - native
      - icu-compat
      - sanitizer
      - coverage
      - static-analysis
      - debian-package
      - bigbedroom-live-probe
      - package-install
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      artifact_name: calendar-release-${{ github.sha }}
      release_sha: ${{ github.sha }}
