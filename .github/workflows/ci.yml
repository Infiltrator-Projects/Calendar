name: build-and-test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every revision is independently qualified. A newer push must never cancel an
# in-flight release candidate that may become a published release.
concurrency:
  group: build-and-test-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native:
    name: Native / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang desktop-file-utils gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xdotool xvfb xz-utils
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CC" == "gcc" ]]; then
            make clean check
          else
            # GCC owns the complete policy/release validation. Clang's distinct
            # purpose is compiling and executing the production C/test surface.
            make clean test
          fi
      - name: Reopen native About dialog twice under Xvfb
        if: matrix.compiler == 'gcc'
        run: xvfb-run -a tools/about-dialog-smoke.sh ./build/calendar-about
      - name: Probe exact-version live Cinnamon qualification
        if: matrix.compiler == 'gcc'
        id: live-cinnamon
        run: tools/live-cinnamon-ci-smoke.sh --probe
      - name: Live Cinnamon smoke of exact source revision
        if: >-
          matrix.compiler == 'gcc' &&
          steps.live-cinnamon.outputs.ready == 'true'
        env:
          CALENDAR_LIVE_MODE: ${{ steps.live-cinnamon.outputs.mode }}
          DEB_BUILD_OPTIONS: nocheck
        run: tools/live-cinnamon-ci-smoke.sh

  icu-compat:
    name: ICU ${{ matrix.icu_major }} runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            icu_major: 72
          - image: debian:13
            icu_major: 76
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare checkout runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gettext gobject-introspection gjs \
            libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3
      - name: Verify ICU major and execute Calendar tests
        shell: bash
        run: |
          set -euo pipefail
          ldconfig -p | grep -Eq "libicuuc\\.so\\.${{ matrix.icu_major }}([[:space:]]|$)"
          make clean test

  sanitizer:
    name: ASan / UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gobject-introspection \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev pkg-config
      - name: ASan and UBSan
        run: make sanitize

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install coverage dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcovr libglib2.0-dev libgtk-3-dev libicu-dev pkg-config
      - name: Coverage gate
        run: make coverage

  static-analysis:
    name: Clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install analysis dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy libglib2.0-dev libgtk-3-dev libicu-dev pkg-config
      - name: Clang-Tidy
        run: make static-analysis

  debian-package:
    needs: [native]
    runs-on: ubuntu-24.04
    outputs:
      release_requested: ${{ steps.release-intent.outputs.requested }}
      release_version: ${{ steps.release-intent.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Resolve release intent from published state
        id: release-intent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          published_tag="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | \
              sort -V | tail -n 1
          )"
          python3 tools/release-handoff.py release-requested \
            --published-version "$published_tag" >> "$GITHUB_OUTPUT"
      - name: Install packaging dependencies
        if: steps.release-intent.outputs.requested == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper desktop-file-utils devscripts gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libgtk-3-dev libicu-dev nodejs \
            pkg-config python3 xz-utils \
            lintian shellcheck
      - name: Run packaging and release gates
        if: steps.release-intent.outputs.requested == 'true'
        env:
          CALENDAR_RELEASE_SOURCE_ALREADY_QUALIFIED: "1"
        run: make release-check
      - name: Create immutable release handoff
        if: steps.release-intent.outputs.requested == 'true'
        run: >-
          python3 tools/release-handoff.py create
          --dist dist
          --source-sha "$GITHUB_SHA"
      - name: Retain exact qualified release handoff
        if: steps.release-intent.outputs.requested == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calendar-release-${{ github.sha }}
          path: |
            dist/calendar_*_amd64.deb
            dist/infiltrator-calendar-resources_*_amd64.deb
            dist/calendar-*-local-folder.run
            dist/release-manifest.json
            dist/release-notes.md
            dist/release-handoff.py
          if-no-files-found: error
          retention-days: 3

  live-cinnamon:
    name: Live Cinnamon / isolated exact-artifact qualification
    needs: [debian-package]
    if: needs.debian-package.outputs.release_requested == 'true'
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    timeout-minutes: 15
    steps:
      - name: Prepare reproducible Cinnamon runtime
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cinnamon dbus-x11 git libglib2.0-bin python3 xvfb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Download exact qualified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calendar-release-${{ github.sha }}
          path: qualified-release
      - name: Locate exact qualified package
        id: qualified-package
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find qualified-release -maxdepth 1 -type f -name 'calendar_*_amd64.deb' -print -quit)
          resources=$(find qualified-release -maxdepth 1 -type f -name 'infiltrator-calendar-resources_*_amd64.deb' -print -quit)
          test -n "$deb" && test -s "$deb"
          test -n "$resources" && test -s "$resources"
          printf 'deb=%s/%s\n' "$GITHUB_WORKSPACE" "$deb" >> "$GITHUB_OUTPUT"
          printf 'resources=%s/%s\n' "$GITHUB_WORKSPACE" "$resources" >> "$GITHUB_OUTPUT"
      - name: Record Cinnamon qualification environment
        shell: bash
        run: |
          set -euo pipefail
          cinnamon --version
          dpkg-query -W -f='${Package} ${Version}\n' cinnamon cjs
      - name: Live Cinnamon runtime qualification
        shell: bash
        run: >-
          tools/isolated-cinnamon-artifact-smoke.sh
          '${{ steps.qualified-package.outputs.deb }}'
          '${{ steps.qualified-package.outputs.resources }}'

  package-install:
    needs: [debian-package]
    if: needs.debian-package.outputs.release_requested == 'true'
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    steps:
      - name: Prepare clean Debian container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gjs python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Download exact qualified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calendar-release-${{ github.sha }}
          path: qualified-release
      - name: Verify exact qualified release handoff
        shell: bash
        run: >-
          python3 qualified-release/release-handoff.py verify
          --dist qualified-release
          --expected-sha "$GITHUB_SHA"
          --github-env "$GITHUB_ENV"
      - name: Install app and resources, then purge only the app
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RELEASE_DEB"
          test -s "$RELEASE_RESOURCES_DEB"
          apt-get install -y --no-install-recommends \
            "./$RELEASE_RESOURCES_DEB" "./$RELEASE_DEB"
          test "$(dpkg-query -W -f='${Status}' calendar)" = "install ok installed"
          test "$(dpkg-query -W -f='${Status}' infiltrator-calendar-resources)" = "install ok installed"
          for id in gregorian hebrew persian coptic iso-week julian revised-julian islamic-umalqura islamic-civil islamic-tbla islamic bahai buddhist ethiopian ethiopic-amete-alem chinese dangi indian japanese minguo roman byzantine egyptian-nabonassar armenian-traditional mayan french-republican swedish-historical international-fixed world positivist; do test -f "/System/Resources/Calendars/$id.so"; done
          /usr/libexec/calendar-about --print-metadata | grep -qx "version=$RELEASE_VERSION"
          /usr/libexec/calendar-about --print-metadata | grep -qx "build-profile=generic"
          CALENDAR_EXPECTED_VERSION="$RELEASE_VERSION" gjs tests/smoke-typelib.js >/dev/null
          apt-get purge -y calendar
          ! dpkg-query -W -f='${Status}' calendar 2>/dev/null | grep -qx "install ok installed"
          test "$(dpkg-query -W -f='${Status}' infiltrator-calendar-resources)" = "install ok installed"
          test -f /System/Resources/Calendars/hebrew.so
          test -f /usr/share/locale/en_AU/LC_MESSAGES/calendar@the-infiltratr.mo
          for id in decimal internet unix hexadecimal binary julian modified-julian standard-12 standard-24 chinese-ke mean-solar sidereal chinese-time solar italian-hours babylonian-hours babylonian-ancient indian-ghati roman-temporal japanese-temporal japanese-temporal-early nuremberg-hours nuremberg-solar; do test -f "/System/Resources/Clocks/$id.so"; done
          apt-get check
          apt-get purge -y infiltrator-calendar-resources
          ! test -e /System/Resources/Calendars/hebrew.so
          ! test -e /System/Resources/Clocks/decimal.so
          apt-get check
      - name: Reinstall and remove the canonical alpha package
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            "./$RELEASE_RESOURCES_DEB" "./$RELEASE_DEB"
          test "$(dpkg-query -W -f='${Status}' calendar)" = "install ok installed"
          apt-get purge -y calendar
          ! dpkg-query -W -f='${Status}' calendar 2>/dev/null | grep -qx "install ok installed"
          apt-get check

  publish-release:
    if: >-
      github.event_name == 'push' &&
      needs.debian-package.outputs.release_requested == 'true'
    needs:
      - native
      - icu-compat
      - sanitizer
      - coverage
      - static-analysis
      - debian-package
      - live-cinnamon
      - package-install
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      artifact_name: calendar-release-${{ github.sha }}
      release_sha: ${{ github.sha }}
