# SPDX-License-Identifier: GPL-3.0-or-later
name: Bug report
description: Report a reproducible problem in Calendar.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Calendar. Do not include secrets or sensitive security details here; use SECURITY.md for vulnerability reports.

  - type: input
    id: version
    attributes:
      label: Calendar version or commit
      description: Release number, tag, or commit SHA.
      placeholder: "1.0.17 or 0123abc..."
    validations:
      required: true

  - type: input
    id: distribution
    attributes:
      label: Linux distribution
      placeholder: "Linux Mint 22.3 / Debian 13 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: cinnamon
    attributes:
      label: Cinnamon version and session
      placeholder: "Cinnamon 6.6 / X11"
    validations:
      required: true

  - type: input
    id: locale
    attributes:
      label: Locale and time zone
      placeholder: "en_AU.UTF-8 / Australia/Melbourne"

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Panel clock / formatting
        - Calendar conversion / navigation
        - Historical calendar model
        - Astronomical / location-dependent clock
        - Events / CalendarServer
        - Settings / localisation
        - Cinnamon UI / layout / accessibility
        - Native library / typelib / ABI
        - Packaging / installation / upgrade
        - Build / CI / release engineering
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant Calendar configuration
      description: Include selected primary/secondary calendar, clock mode, seconds setting, and whether Geographic location is enabled. Do not publish precise coordinates unless they are necessary and you are comfortable doing so.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or evidence
      description: Include only relevant output. Remove credentials, private event data, precise location and unrelated personal information where possible.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I have not included secrets or sensitive security information.
          required: true
